version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The Swift package manifest is at the repository root. The Xcode app's
  # nested Package.resolved is not a standalone Swift package directory.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      swift-dependencies:
        patterns: ["*"]
